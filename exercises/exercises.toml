# Exercise manifest for rhelings.
#
# Each [[exercises]] entry maps to a directory at exercises/<dir>/<name>/
# containing task.md, check.sh, hint.md, solution.md, and optionally setup.sh.
#
# Order in this file is the order exercises are presented, so it runs roughly
# easiest-to-hardest rather than by objective category.
#
# domain: matches the 9 official RHCSA (EX200) objective categories, so progress
# can be reported per-domain later. Use only the exact strings from that list --
# a topic directory can span more than one domain (02_permissions splits between
# essential tools and file systems, for instance).
# kind: "standard" (default) or "reboot" -- reboot exercises verify state persisted
# across a reboot by comparing /proc/sys/kernel/random/boot_id before/after.
# watch_file: reserved for a future v2 auto-recheck-on-save feature. Unused in v1.

welcome_message = """
Welcome to rhelings.

This tool changes real system state on the machine it runs on: SELinux modes and
contexts, and in later milestones LVM volumes, firewalld rules, users, and boot
configuration. There is no sandbox and no simulation layer.

Run this ONLY on a disposable VM you can destroy and rebuild -- never on a system
you care about. You should be running as root.
"""

final_message = """
All current exercises done.

That is 82 exercises across 16 topics: essential tools, users and groups,
permissions, partitions, swap, LVM, SELinux, packages, networking, systemd,
journald, SSH, firewalld, network storage, boot recovery, and containers.

Finishing them is not the same as being ready. EX200 is 2.5 hours of doing, not
recognising -- rebuild the VM and run the set again against a clock.
"""

