[package]
name = "rhelings"
version = "0.1.0"
description = "RHCSA drill loop -- mutates real system state. Run on a disposable VM only."
authors = ["Jeff <machinageist@proton.me>"]
repository = "https://github.com/machinageist/rhelings"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["windows", "events"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
